name: Generate rainbow snake animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate rainbow snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: VidhitaYadav
          outputs: |
            dist/snake.svg?color_snake=FF6B6B&color_dots=FFB347,FFD700,9B59B6,4ECDC4,FF6B9D
          
      - name: push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
